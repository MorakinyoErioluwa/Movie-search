<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <title>Movie Finder</title>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-black text-white">

    <main class="w-full max-w-7xl mx-auto px-6 py-12">
        <!-- Heading -->
        <header class="text-center mb-16">
            <h1 class="text-5xl md:text-6xl font-black font-extrabold tracking-tight">
                🎬 Movie Finder
             </h1>

            <p class="text-slate-300 mt-4 text-lg">
                Find your next movie
            </p>
        </header>

        <!-- Search Form -->
        <form id="searchForm" class="flex flex-col md:flex-row gap-4 max-w-3xl mx-auto mb-12">
            <label for="searchInput" class="sr-only">
                Search Movie
            </label>

            <input
                type="text"
                id="searchInput"
                placeholder="Search for a movie..."
                class="flex-1 mt-4 rounded-xl bg-slate-900 border border-slate-700 px-6 py-4 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-300"
            />
            

            <!-- Search Button -->
            <button
                type="submit"
                class="bg-blue-600 hover:bg-blue-700 active:scale-95 shadow-lg rounded-xl px-8 py-4 mt-4
                font-semibold transition-all duration-300" >
                    🔍 Search
            </button>

        </form>

        <!-- Results -->
        <div 
            id="resultsHeader"
            class="hidden flex-col md:flex-row md:items-center
            md:justify-between gap-4 mb-8 border-b border-slate-700 pb-6">

            <h2 id="resultsTitle" class="text-3xl font-bold text-white"></h2>

            <p id="resultsCount" class="hidden"></p>
        </div>

        <!-- Results Grid -->
        <section id="results" class="grid grid-cols-1 sm:grid-cols-2
            lg:grid-cols-3 xl:grid-cols-4 gap-8">
        </section>
    </main>

    <script src="./script.js"></script>  

</body>
</html>
